<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intellicomp deck</title>
<link rel="stylesheet" href="../.github/skills/make-deck/runtime/slides.css">
<script src="../.github/skills/make-deck/runtime/deck.js"></script>
</head>
<body>
<!-- Write the deck between the two script tags below. Change nothing else in this file. -->
<script type="text/plain" id="deck">
title: Replace with the deck title
date: Replace with the date the user gave, or delete this line
outline: Replace with the user's message, pasted exactly as they typed it (all of it, on as many lines as it takes)

--- title
eyebrow: Replace with "Webinar" if the outline says it is one, or delete this line
heading: Replace with the title of the talk
subheading: Replace with one line on what the audience will get

--- bullets
heading: Replace with the point of this slide
- First point
- Second point
- Third point

--- closing
heading: Let's talk about your IT
cta: Book a consultation
</script>
</body>
</html>
